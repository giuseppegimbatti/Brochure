<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrimonio scolastico Potenza — Brochure sfogliabile</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8ebe8;color:#18323b;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}.top{width:100%;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#f8faf8;border-bottom:1px solid #d4ddd7}.top strong{font-size:16px}.top a{color:#275e4b;font-size:13px}.stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:25px 14px;perspective:1800px}.book{display:flex;align-items:stretch;justify-content:center;width:min(1100px,96vw,150vh);height:auto;aspect-ratio:2 / 1;filter:drop-shadow(0 12px 17px #0002);position:relative}.page{height:100%;width:50%;background:white;position:relative;overflow:hidden;transform-style:preserve-3d}.page img{width:100%;height:100%;object-fit:contain;background:#fff}.page.left{border-radius:4px 0 0 4px;box-shadow:inset -7px 0 12px #0001}.page.right{border-radius:0 4px 4px 0;box-shadow:inset 7px 0 12px #0001}.page.empty{background:transparent;box-shadow:none}.book:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#455a5330;pointer-events:none}.controls{display:flex;align-items:center;gap:16px;padding:0 12px 25px}.controls button{border:0;border-radius:50%;width:46px;height:46px;background:#245b49;color:white;font-size:25px;cursor:pointer}.controls button:disabled{opacity:.25;cursor:default}.count{min-width:125px;text-align:center;font-size:14px}.turn{animation:turn .52s ease-in-out}@keyframes turn{0%{transform:rotateY(0)}48%{transform:rotateY(-8deg) scale(.98)}100%{transform:rotateY(0)}}@media(max-width:650px){.stage{padding:12px 6px}.book{width:min(94vw,75vh);height:auto;aspect-ratio:1 / 1}.page{width:100%}.page.empty{display:none}.page:not(.empty){flex:1}.book:after{display:none}.top strong{font-size:13px}}
</style></head><body><header class="top"><strong>Provincia di Potenza · Patrimonio scolastico</strong><a href="brochure-24x24.pdf" download>PDF originale</a></header><main class="stage"><div class="book" id="book" aria-label="Brochure sfogliabile"></div></main><nav class="controls"><button id="prev" aria-label="Pagina precedente">‹</button><span class="count" id="count"></span><button id="next" aria-label="Pagina successiva">›</button></nav><script>
const pages=["pages/pagina-01.jpg","pages/pagina-02.jpg","pages/pagina-03.jpg","pages/pagina-04.jpg","pages/pagina-05.jpg","pages/pagina-06.jpg","pages/pagina-07.jpg","pages/pagina-08.jpg","pages/pagina-09.jpg"];let spread=0;const book=document.getElementById('book');const mobile=()=>innerWidth<=650;const max=()=>mobile()?pages.length-1:Math.ceil((pages.length+1)/2)-1;
function draw(){book.innerHTML='';let indexes=mobile()?[spread]:spread===0?[null,0]:[2*spread-1,2*spread];for(let i=0;i<indexes.length;i++){const n=indexes[i],d=document.createElement('div');d.className='page '+(i===0&&!mobile()?'left':'right')+(n==null||n>=pages.length?' empty':'');if(n!=null&&n<pages.length){let im=document.createElement('img');im.src=pages[n];im.alt='Pagina '+(n+1);d.append(im)}book.append(d)}book.classList.remove('turn');void book.offsetWidth;book.classList.add('turn');document.getElementById('prev').disabled=spread===0;document.getElementById('next').disabled=spread>=max();document.getElementById('count').textContent=mobile()?`Pagina ${spread+1} di ${pages.length}`:spread===0?'Copertina · 1 di '+pages.length:`Pagine ${2*spread}–${Math.min(2*spread+1,pages.length)} di ${pages.length}`}
function go(dir){spread=Math.max(0,Math.min(max(),spread+dir));draw()}document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});let sx=0;book.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});book.addEventListener('touchend',e=>{let delta=e.changedTouches[0].clientX-sx;if(Math.abs(delta)>45)go(delta<0?1:-1)});book.addEventListener('click',e=>{if(e.clientX>innerWidth/2)go(1);else go(-1)});window.addEventListener('resize',()=>{spread=Math.min(spread,max());draw()});draw();</script></body></html>
